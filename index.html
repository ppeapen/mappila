<!--
  ===========================================================================
  MAPPILA MALAYALAM NT — index.html
  ===========================================================================
  This page just builds a menu of NT books from books.json and links each
  available one to reader.html, which does the actual USFM -> HTML rendering
  (see assets/js/usfm-parser.js and assets/js/reader.js).

  TO ADD A NEW BOOK ONCE ITS .sfm FILE IS READY:
    1. Upload the .sfm file into the /books folder of this repo.
       Keep the filename EXACTLY as it appears in books.json (GitHub Pages
       is served from a case-sensitive filesystem, unlike Windows).
    2. Open books.json and, for that book's entry, set:  "available": true
       (the "file" path already points at the expected filename).
    3. Commit + push. No other change is needed — this page, reader.html
       and the parser are all book-agnostic.

  That's it: nothing in index.html itself needs to change to add a book.
  You'd only touch this file's HTML/CSS if you wanted to change the page
  layout itself (e.g. add a search box or a different grouping).
  ===========================================================================
-->

    <link rel="stylesheet" href="assets/css/style.css">
    <style>
      .eng {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
      img {display: block; margin: 0px auto 0px auto;}
    </style>

<body>

<header class="site-header">
  <h1>പരിശുദ്ധ ഇഞ്ചീൽ</h1>
  <p class="subtitle eng">മുസ്ലീം മലയാള വിവർത്തനം</p>
</header>

<main>
  <p>
    വായിക്കാൻ ഒരു പുസ്തകം തിരഞ്ഞെടുക്കുക.
    <br>
    <small><span class="eng">Choose a book below to start reading. Books greyed out are not
    yet available in this format.</span></small>
  </p>

  <!--
    New-Testament-wide preface, loaded from books/40MNTPRE.sfm by
    assets/js/nt-preface.js (see that file to change the source path).
    Uses the same .intro-box styling as the per-book preface in reader.html.
  -->
  <details class="intro-box" id="ntPreface">
    <summary>ആമുഖം</summary>
    <div class="intro-box-body">
      <p class="loading">ഒരു നിമിഷം ...</p>
    </div>
  </details>

  <div id="bookList">
    <p class="loading">ഒരു നിമിഷം ...</p>
  </div>

  <div style="height:100px"></div>
  <p class="eng" style="text-align: center; font-size: rem;">ഈ വെബ്‍സൈറ്റ് പങ്കുവയ്‍ക്കുക</p>
  <figure>
    <a href="./assets/img/qr-index.svg">

    </a>

  </figure>
</main>

<footer class="site-footer eng">
   Source files hosted on
  <a href="https://github.com/ppeapen/mappila">Github</a>
</footer>

<script src="assets/js/usfm-parser.js"></script>
<script src="assets/js/nt-preface.js"></script>
<script>
(function () {
  'use strict';

  // Previously books were split into two groups ("Gospels" and "Rest of
  // the New Testament") using a GOSPEL_CODES set. That grouping has been
  // removed per request -- all books are now shown in a single flat grid,
  // sorted in standard New Testament (USFM) book order. If a grouped view
  // is ever wanted again, filter `books` into subsets inside renderBooks()
  // and build one section (heading + grid) per subset, the way the old
  // code did.

  fetch('books.json')
    .then(res => res.json())
    .then(data => renderBooks(data.books))
    .catch(err => {
      document.getElementById('bookList').innerHTML =
        '<p class="error-box">പുസ്തകങ്ങളുടെ പട്ടിക ലോഡ് ചെയ്യാനായില്ല (books.json). ' +
        String(err.message || err) + '</p>';
    });

  function renderBooks(books) {
    // Keep books in standard New Testament order (Matthew..Revelation),
    // regardless of the order they appear in books.json.
    books.sort((a, b) => a.usfmNum - b.usfmNum);

    // Single flat grid -- no section grouping/headings.
    const html = `<div class="book-grid">${books.map(bookCard).join('')}</div>`;

    document.getElementById('bookList').innerHTML = html;
  }

  function bookCard(book) {
    const malSpan = `<span class="mal-name">${book.name}</span>`;
    const engSpan = `<span class="eng-name">${book.engName}</span>`;

    if (book.available) {
      const href = `reader.html?book=${encodeURIComponent(book.file)}&name=${encodeURIComponent(book.name)}`;
      return `<a class="book-card" href="${href}">${malSpan}${engSpan}</a>`;
    }
    // Not available yet: render as a disabled-looking, non-clickable card.
    return `<span class="book-card coming-soon" aria-disabled="true">${malSpan}${engSpan}</span>`;
  }
})();
</script>

</body>
